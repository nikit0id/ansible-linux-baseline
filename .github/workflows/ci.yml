name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          pip install -r requirements.txt
          ansible-galaxy collection install -r requirements.yml
          ansible-lint site.yml roles
          ansible-playbook -i inventories/staging/hosts.example.yml site.yml --syntax-check
          shellcheck scripts/*
      - name: Exercise all roles and verify idempotence on Ubuntu
        run: scripts/test
