---
- name: Configure the Ubuntu baseline
  hosts: baseline
  become: true
  serial: 1
  pre_tasks:
    - name: Require Ubuntu 24.04 and a non-root operator
      ansible.builtin.assert:
        that:
          - ansible_facts.distribution == 'Ubuntu'
          - ansible_facts.distribution_version == '24.04'
          - baseline_operator is match('^[a-z_][a-z0-9_-]*$')
          - baseline_operator != 'root'
          - baseline_public_key is match('^ssh-ed25519 [A-Za-z0-9+/]+=*( |$)')
    - name: Refresh the Ubuntu package index
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
  roles:
    - users
    - firewall
    - ssh_hardening
